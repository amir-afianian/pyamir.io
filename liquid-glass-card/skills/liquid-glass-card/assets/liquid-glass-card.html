<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liquid Glass Card</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;box-sizing:border-box;background:#07060c}.lg-stage{max-width:960px}</style>
</head>
<body>
<!-- Liquid glass card: self-contained. Edit LG_CONFIG and the .lg-content markup. -->
<style>
.lg-stage{position:relative;width:100%;aspect-ratio:16/10;min-height:320px;border-radius:20px;overflow:hidden;background:#07060c;touch-action:none}
.lg-stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.lg-content{position:absolute;left:0;top:0;transform-origin:50% 50%;overflow:hidden;pointer-events:none;
  display:flex;flex-direction:column;justify-content:center;gap:6px;padding:0 28px;color:#fff;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-shadow:0 1px 12px rgba(0,0,0,.35)}
.lg-content .k{font:500 .72rem/1.2 ui-monospace,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.lg-content .v{font-weight:700;font-size:clamp(1.6rem,4vw,2.6rem);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.lg-content .s{font-size:.9rem;opacity:.8}
/* Fallback when WebGL is missing: CSS glass (frost + rim, no bending) */
.lg-stage.lg-fallback{background:radial-gradient(40% 50% at 70% 65%,#ff6b14aa,transparent 70%),#07060c}
.lg-stage.lg-fallback .lg-content{background:rgb(10 10 15/.55);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);
  border:1px solid rgb(255 255 255/.16);box-shadow:inset 0 1px 0 rgb(255 255 255/.3),inset 0 -18px 40px rgb(0 0 0/.35)}
</style>

<div class="lg-stage" id="lg-stage" role="img" aria-label="Revenue card: $48,210, up 12.4% versus last month">
  <canvas></canvas>
  <div class="lg-content" aria-hidden="true">
    <span class="k">Monthly recurring revenue</span>
    <span class="v">$48,210</span>
    <span class="s">+12.4% vs. last month</span>
  </div>
</div>

<script>
const LG_CONFIG = {
  card: { width: 480, height: 200, x: 0.48, y: 0.5, radius: 0.10, draggable: true }, // width/height in CSS px (capped to the stage), x/y = centre as fraction of stage, radius = fraction of card width
  background: "#07060c",
  glows: [ // up to 3 soft colour blobs; x/y as fraction of stage, r = size as fraction of stage height
    { color: "#ff6b14", x: 0.66, y: 0.60, r: 0.24, intensity: 1.25 },
    { color: "#f22e73", x: 0.80, y: 0.78, r: 0.20, intensity: 0.85 },
    { color: "#5940ff", x: 0.30, y: 0.80, r: 0.22, intensity: 0.70 }
  ],
  dotGrid: true,
  glass: { refraction: 20, dispersion: 0, frost: 14, lightAngle: 300, tint: "#0a0a0f", tintAmount: 0.35 },
  motion: { driftGlows: true, bounceIn: true }
};

(function(cfg){
  const stage=document.getElementById('lg-stage'), cv=stage.querySelector('canvas'), ui=stage.querySelector('.lg-content');
  const gl=cv.getContext('webgl',{antialias:false});
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function fallback(){stage.classList.add('lg-fallback');cv.remove();
    const r=stage.getBoundingClientRect(),w=Math.min(cfg.card.width,r.width*.9),h=Math.min(cfg.card.height,r.height*.8);
    Object.assign(ui.style,{width:w+'px',height:h+'px',borderRadius:Math.min(w*cfg.card.radius,h/2)+'px',
      transform:`translate(${cfg.card.x*r.width-w/2}px,${cfg.card.y*r.height-h/2}px)`});}
  if(!gl){fallback();return;}
  const hex=h=>{h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.substr(i,2),16)/255);};
  const vs='attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
  const fs=`precision highp float;
uniform vec2 R,C,S;uniform float T,dpr,refr,disp,frost,lang,sy,rf,grid,tmix,drift;uniform vec3 BG,TINT,GC[3];uniform vec4 GP[3];
float sdRB(vec2 p,vec2 b,float r){vec2 q=abs(p)-b+r;return length(max(q,0.))+min(max(q.x,q.y),0.)-r;}
vec3 bg(vec2 p){
  vec2 u=p/R.y; float ar=R.x/R.y; vec3 col=BG;
  for(int i=0;i<3;i++){
    float fi=float(i);
    vec2 o=vec2(GP[i].x*ar+drift*.12*sin(T*(.23+.05*fi)+fi*2.1),GP[i].y+drift*.08*cos(T*(.27+.04*fi)+fi));
    col+=GC[i]*GP[i].w*exp(-pow(length(u-o)/max(GP[i].z,.001),2.));
  }
  vec2 g=fract(p/(26.*dpr))-.5; col+=grid*smoothstep(.09,.05,length(g))*.10*(.4+col);
  return col;
}
void main(){
  vec2 p=gl_FragCoord.xy; p.y=R.y-p.y;
  vec2 lp=p-C; vec2 b=vec2(S.x,S.y*sy)*.5; float rad=min(S.x*rf,b.y);
  float d=sdRB(lp,b,rad); vec3 col;
  if(d<0.){
    float e=1.5*dpr;
    vec2 n=normalize(vec2(sdRB(lp+vec2(e,0),b,rad)-sdRB(lp-vec2(e,0),b,rad),sdRB(lp+vec2(0,e),b,rad)-sdRB(lp-vec2(0,e),b,rad))+1e-5);
    float edge=1.-clamp(-d/(34.*dpr),0.,1.); float k=edge*edge;
    vec2 off=-n*refr*dpr*k*1.6-lp*.04; float ca=disp*.012;
    vec3 acc=vec3(0.); float fr=frost*dpr;
    for(int i=0;i<9;i++){float a=float(i)*2.39996;vec2 q=p+off+vec2(cos(a),sin(a))*fr*sqrt(float(i)/9.);
      acc.r+=bg(q+off*ca*8.).r;acc.g+=bg(q).g;acc.b+=bg(q-off*ca*8.).b;}
    col=mix(acc/9.,TINT,tmix);
    col*=1.-.35*smoothstep(0.,1.,edge)*(1.-k);
    vec2 L=vec2(cos(radians(lang)),sin(radians(lang)));
    float rim=smoothstep(3.*dpr,0.,abs(d+1.2*dpr));
    float spec=pow(max(dot(n,L),0.),3.), spec2=pow(max(dot(n,-L),0.),3.)*.4;
    col+=rim*(.25+1.1*spec+spec2)+pow(edge,5.)*(.5*spec+.15)*.6;
    col=mix(bg(p),col,smoothstep(0.,-1.2*dpr,d));
  } else {
    col=bg(p)*(1.-.4*exp(-d/(26.*dpr))*smoothstep(-10.*dpr,40.*dpr,lp.y+d*.3));
  }
  col=col/(1.+col*.35);
  gl_FragColor=vec4(pow(col,vec3(.92)),1.);
}`;
  function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(o);return o;}
  let pr; try{pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);}catch(e){console.error(e);fallback();return;}
  gl.useProgram(pr);
  gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const al=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(al);gl.vertexAttribPointer(al,2,gl.FLOAT,false,0,0);
  const locs={},U=n=>locs[n]??=gl.getUniformLocation(pr,n);
  const NO_GLOW={color:'#000000',x:0,y:0,r:.01,intensity:0}, GLOW_DEFAULTS={color:'#000000',x:.5,y:.5,r:.2,intensity:1};
  let warnedExtraGlows=false;
  function glowSlots(glows=[]){
    if(glows.length>3&&!warnedExtraGlows){warnedExtraGlows=true;console.warn(`liquid-glass-card: the shader has 3 glow slots; ignoring ${glows.length-3} extra glow(s).`);}
    return [0,1,2].map(i=>glows[i]?{...GLOW_DEFAULTS,...glows[i]}:NO_GLOW);
  }
  const GC=new Float32Array(9),GP=new Float32Array(12);
  // Every config-derived uniform is re-sent each frame, so edits to stage.lgConfig's glows, background and glass apply live.
  function uploadConfig(){
    glowSlots(cfg.glows).forEach((g,i)=>{GC.set(hex(g.color),i*3);GP.set([g.x,g.y,g.r,g.intensity],i*4);});
    gl.uniform3fv(U('GC'),GC);gl.uniform4fv(U('GP'),GP);
    gl.uniform1f(U('refr'),cfg.glass.refraction);gl.uniform1f(U('disp'),cfg.glass.dispersion);gl.uniform1f(U('frost'),cfg.glass.frost);gl.uniform1f(U('lang'),cfg.glass.lightAngle);
    gl.uniform3fv(U('BG'),hex(cfg.background));gl.uniform3fv(U('TINT'),hex(cfg.glass.tint));
    gl.uniform1f(U('tmix'),cfg.glass.tintAmount);gl.uniform1f(U('grid'),cfg.dotGrid?1:0);gl.uniform1f(U('rf'),cfg.card.radius);
    gl.uniform1f(U('drift'),cfg.motion.driftGlows&&!reduce?1:0);
  }
  stage.lgConfig=cfg;
  let W=0,H=0,dpr=1,cx=cfg.card.x,cy=cfg.card.y,t=0,last=performance.now();
  function size(){dpr=Math.min(devicePixelRatio||1,2);const r=stage.getBoundingClientRect();W=r.width;H=r.height;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);gl.viewport(0,0,cv.width,cv.height);}
  new ResizeObserver(size).observe(stage);size();
  // After Effects overshoot expression (freq 1.5, amplitude 0.1, decay 4.5), ported
  let t0=performance.now()+300;
  function scaleY(now){if(!cfg.motion.bounceIn||reduce)return 1;const s=(now-t0)/1000;if(s<0)return .02;const d=.28;
    if(s<d){const x=s/d;return .02+.98*x*x*(3-2*x);}const u=s-d;return 1+(.98/d*1.5)*.1*Math.sin(1.5*u*2*Math.PI)/Math.exp(4.5*u);}
  stage.lgReplay=()=>{t0=performance.now();};
  const card=()=>{const w=Math.min(cfg.card.width,W*.9),h=Math.min(cfg.card.height,H*.8);return{w,h,x:cx*W,y:cy*H};};
  let drag=null;
  if(cfg.card.draggable){
    stage.addEventListener('pointerdown',e=>{const r=stage.getBoundingClientRect(),c=card(),x=e.clientX-r.left,y=e.clientY-r.top;
      if(Math.abs(x-c.x)<c.w/2&&Math.abs(y-c.y)<c.h/2){drag={dx:x-c.x,dy:y-c.y};stage.setPointerCapture(e.pointerId);}});
    stage.addEventListener('pointermove',e=>{if(!drag)return;const r=stage.getBoundingClientRect(),c=card();
      cx=Math.min(Math.max((e.clientX-r.left-drag.dx)/W,c.w/2/W),1-c.w/2/W);cy=Math.min(Math.max((e.clientY-r.top-drag.dy)/H,c.h/2/H),1-c.h/2/H);});
    ['pointerup','pointercancel'].forEach(v=>stage.addEventListener(v,()=>drag=null));
  }
  function frame(now){
    t+=(now-last)/1000;last=now;const c=card(),sy=Math.max(scaleY(now),.02);
    gl.uniform2f(U('R'),cv.width,cv.height);gl.uniform1f(U('T'),t+3);gl.uniform1f(U('dpr'),dpr);
    gl.uniform1f(U('sy'),sy);gl.uniform2f(U('C'),c.x*dpr,c.y*dpr);gl.uniform2f(U('S'),c.w*dpr,c.h*dpr);
    uploadConfig();
    gl.drawArrays(gl.TRIANGLES,0,3);
    Object.assign(ui.style,{width:c.w+'px',height:c.h+'px',borderRadius:Math.min(c.w*cfg.card.radius,c.h/2)+'px',
      transform:`translate(${c.x-c.w/2}px,${c.y-c.h/2}px) scaleY(${sy})`,opacity:Math.min(1,Math.max(0,(sy-.3)/.5))});
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})(LG_CONFIG);
</script>
</body>
</html>
