version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /liquid-glass-card
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    groups:
      dev-dependencies:
        patterns: ["*"]
