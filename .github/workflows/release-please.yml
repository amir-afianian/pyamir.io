name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-please
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs['liquid-glass-card--release_created'] }}
      tag_name: ${{ steps.release.outputs['liquid-glass-card--tag_name'] }}
    steps:
      # Pull requests opened with the default token do not trigger CI. Set a
      # RELEASE_PLEASE_TOKEN secret (PAT or app token) to get checks on the release PR.
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  skill-zip:
    name: Attach skill zip
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Build skill zip
        run: sh liquid-glass-card/scripts/build-skill-zip.sh
      - name: Upload zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" liquid-glass-card/dist/liquid-glass-card.zip --clobber
