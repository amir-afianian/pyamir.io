name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  manifests:
    name: Manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Check manifest consistency
        run: node scripts/check-manifests.mjs
      - name: Test the manifest check
        run: node --test scripts/*.test.mjs
      - name: Validate Claude marketplace and plugin manifests
        run: npx -y @anthropic-ai/claude-code@2.1.294 plugin validate .

  test:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: liquid-glass-card
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: liquid-glass-card/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npx playwright test
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure
          path: |
            liquid-glass-card/test-results/
            liquid-glass-card/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
